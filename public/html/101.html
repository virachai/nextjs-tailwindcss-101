<div style="display: flex; align-items: center; gap: 12px; font-family: Arial, sans-serif">
  <label style="font-size: 14px; color: #333">Select Revenue Mode:</label>

  <!-- Toggle Switch -->
  <label style="position: relative; display: inline-block; width: 60px; height: 34px">
    <input type="checkbox" style="opacity: 0; width: 0; height: 0" />
    <span
      style="
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: 0.4s;
        border-radius: 34px;
      "
    ></span>
    <span
      style="
        position: absolute;
        content: '';
        height: 26px;
        width: 26px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        transition: 0.4s;
        border-radius: 50%;
      "
    ></span>
  </label>

  <span id="statusText" style="font-size: 14px; color: #333">Donate Only</span>
</div>

<script>
  const toggle = document.querySelector('input[type="checkbox"]');
  const statusText = document.getElementById('statusText');
  const slider = toggle.nextElementSibling;
  const circle = slider.nextElementSibling;

  toggle.addEventListener('change', function () {
    if (this.checked) {
      slider.style.backgroundColor = '#4CAF50';
      circle.style.transform = 'translateX(26px)';
      statusText.textContent = 'Donate & Sell';
    } else {
      slider.style.backgroundColor = '#ccc';
      circle.style.transform = 'translateX(0)';
      statusText.textContent = 'Donate Only';
    }
  });
</script>
