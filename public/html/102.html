<div style="display: flex; align-items: center; gap: 12px; font-family: Arial, sans-serif">
  <label style="font-size: 14px; color: #333">เลือกโหมดรายได้:</label>

  <!-- Toggle Switch -->
  <label style="position: relative; display: inline-block; width: 52px; height: 28px">
    <input type="checkbox" style="opacity: 0; width: 0; height: 0" />
    <span
      style="
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: 0.4s;
        border-radius: 28px;
      "
    ></span>
    <span
      style="
        position: absolute;
        content: '';
        height: 22px;
        width: 22px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        transition: 0.4s;
        border-radius: 50%;
      "
    ></span>
  </label>

  <span id="statusTextDonate" style="font-size: 14px; color: #333">รับบริจาคเท่านั้น</span>
  <span id="statusTextSell" style="font-size: 14px; color: #333; display: none"
    >รับบริจาคและขาย</span
  >
</div>

<script>
  const toggle = document.querySelector('input[type="checkbox"]');
  const statusTextDonate = document.getElementById('statusTextDonate');
  const statusTextSell = document.getElementById('statusTextSell');
  const slider = toggle.nextElementSibling;
  const circle = slider.nextElementSibling;

  toggle.addEventListener('change', function () {
    statusTextDonate.style.display = 'none';
    statusTextSell.style.display = 'none';

    if (this.checked) {
      slider.style.backgroundColor = '#4CAF50';
      circle.style.transform = 'translateX(22px)';
      statusTextSell.style.display = 'inline-block';
    } else {
      slider.style.backgroundColor = '#ccc';
      circle.style.transform = 'translateX(0)';
      statusTextDonate.style.display = 'inline-block';
    }
  });
</script>
