<p style="display: none">Read Google Sheets CSV</p>

<div class="image-overlay-container separator" style="width: calc(100% + 32px)">
  <figure>
    <img
      class="!aspect-512/288 object-cover"
      style="max-height: 160px; transform: scale(1.02)"
      alt="Background Image"
      data-original-height="641"
      data-original-width="360"
      src="https://t3.ftcdn.net/jpg/06/09/41/00/360_F_609410035_rrpJAitQiSA9xNfG2HbFqTSDKRq9S6ci.jpg"
      width="512"
    />
  </figure>
</div>

<div id="table-container">Loading data…</div>

<script
  src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
></script>

<style>
  table {
    border-collapse: collapse;
    width: 100%;
  }
  table,
  th,
  td {
    border: 1px solid #aaa;
  }
  th,
  td {
    padding: 8px;
    text-align: left;
  }
  th {
    background-color: #ddd;
  }
</style>

<script>
  const csvUrl =
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vR9Hn87Us8-D5hKZWUTfMYYejjS2u3syq6gicnJuHMOSf9ecqDF3gzMZNPa0-TWJFZIf2bzTN3qP876/pub?gid=2043095097&single=true&output=csv';

  fetch(csvUrl)
    .then((response) => {
      if (!response.ok) {
        throw new Error(`Network response was not ok: ${response.statusText}`);
      }
      return response.text();
    })
    .then((csvText) => {
      console.log(csvText);
      //   if (csvText) return;
      // Parse CSV to array of objects
      const data = Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true,
      }).data;

      renderTable(data);
    })
    .catch((error) => {
      document.getElementById('table-container').innerText =
        'Error loading or parsing CSV: ' + error.message;
      console.error(error);
    });

  function renderTable(data) {
    if (!data || data.length === 0) {
      document.getElementById('table-container').innerText = 'No data found';
      return;
    }

    const container = document.getElementById('table-container');
    const table = document.createElement('table');

    // Header row
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    Object.keys(data[0]).forEach((colName) => {
      const th = document.createElement('th');
      th.textContent = colName;
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    // Body rows
    const tbody = document.createElement('tbody');
    data.forEach((rowObj) => {
      const tr = document.createElement('tr');
      Object.values(rowObj).forEach((cellValue) => {
        const td = document.createElement('td');
        td.textContent = cellValue;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    // Clear and append
    container.innerHTML = '';
    container.appendChild(table);
  }
</script>
