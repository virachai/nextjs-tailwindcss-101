<div class="container" id="prompt-form-container">
  <div class="form-container">
    <div class="success-message" id="successMessage">
      <svg class="icon icon-success icon-lg">
        <use xlink:href="#success-icon"></use>
      </svg>
      ส่งข้อมูลเรียบร้อยแล้ว! ขอบคุณสำหรับการส่งพร้อมของคุณ
    </div>

    <form id="promptForm">
      <div class="form-group">
        <label for="phone" class="required">
          <svg class="icon icon-primary">
            <use xlink:href="#phone-icon"></use>
          </svg>
          หมายเลขโทรศัพท์มือถือ
        </label>
        <div class="icon-container">
          <svg class="icon">
            <use xlink:href="#phone-icon"></use>
          </svg>
        </div>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="ตัวอย่าง: 0912345678"
          inputmode="decimal"
          pattern="0[0-9]{9}"
          required
        />
        <div class="error-message" id="phoneError">
          กรุณากรอกหมายเลขโทรศัพท์มือถือให้ถูกต้อง (ตัวอย่าง: 0912345678)
        </div>
      </div>

      <div class="form-group">
        <label for="prompt" class="required">
          <svg class="icon icon-primary">
            <use xlink:href="#prompt-icon"></use>
          </svg>
          Prompt
        </label>
        <textarea
          id="prompt"
          name="prompt"
          placeholder="กรุณากรอกคำอธิบายภาพที่คุณต้องการสร้าง"
          required
        ></textarea>
        <div class="error-message" id="promptError">กรุณากรอกพร้อม</div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn" disabled>
        <svg class="icon icon-white">
          <use xlink:href="#send-icon"></use>
        </svg>
        ส่งพร้อม
      </button>
    </form>

    <div class="form-footer">ข้อมูลของคุณจะถูกบันทึกผ่าน Google Form</div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const submitBtn = document.getElementById('submitBtn');
    const promptForm = document.getElementById('promptForm');
    const successMessage = document.getElementById('successMessage');

    // ฟังก์ชันตรวจสอบความถูกต้องของฟอร์ม
    function validateForm() {
      let isValid = true;

      // ตรวจสอบหมายเลขโทรศัพท์
      const phone = document.getElementById('phone');
      const phoneError = document.getElementById('phoneError');
      const phoneRegex = /^[0-9]{10}$/;
      if (!phoneRegex.test(phone.value.trim())) {
        phoneError.style.display = 'block';
        isValid = false;
      } else {
        phoneError.style.display = 'none';
      }

      // ตรวจสอบ Prompt
      const prompt = document.getElementById('prompt');
      const promptError = document.getElementById('promptError');
      if (!prompt.value.trim()) {
        promptError.style.display = 'block';
        isValid = false;
      } else {
        promptError.style.display = 'none';
      }

      return isValid;
    }

    // จัดการการส่งฟอร์ม
    promptForm.addEventListener('submit', function (e) {
      e.preventDefault();

      if (validateForm()) {
        // ในสถานการณ์จริงจะเป็นการส่งข้อมูลไปยัง Google Form
        // ที่นี่เราจะจำลองการส่งข้อมูลสำเร็จ
        successMessage.style.display = 'block';
        promptForm.reset();
        submitBtn.disabled = true;

        // เลื่อนไปที่ด้านบนเพื่อแสดงข้อความสำเร็จ
        window.scrollTo(0, 0);

        // รีเซ็ตฟอร์มหลังจาก 3 วินาที
        setTimeout(function () {
          successMessage.style.display = 'none';
        }, 5000);
      }
    });

    // ตรวจสอบความถูกต้องแบบเรียลไทม์
    const inputs = document.querySelectorAll('input, textarea');
    inputs.forEach((input) => {
      input.addEventListener('blur', function () {
        if (submitBtn.disabled === false) {
          validateForm();
        }
      });
    });
  });
</script>
