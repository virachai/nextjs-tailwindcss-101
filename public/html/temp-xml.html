<script>
  function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0,
        v = c == 'x' ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }

  // Example usage:
  // const myUuid = generateUUID();
  // console.log(myUuid);

  document.addEventListener('DOMContentLoaded', function () {
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const promptForm = document.getElementById('promptForm');
    const successMessage = document.getElementById('successMessage');
    const phoneInput = document.getElementById('phone');
    const promptInput = document.getElementById('prompt');

    // ฟังก์ชันตรวจสอบความถูกต้องของฟอร์ม
    function validateForm() {
      let isValid = true;

      // ตรวจสอบหมายเลขโทรศัพท์
      const phone = document.getElementById('phone');
      const phoneError = document.getElementById('phoneError');
      const phoneRegex = /^[0-9]{10}$/;
      if (!phoneRegex.test(phone.value.trim())) {
        phoneError.style.display = 'block';
        isValid = false;
      } else {
        phoneError.style.display = 'none';
      }

      // ตรวจสอบ Prompt
      const prompt = document.getElementById('prompt');
      const promptError = document.getElementById('promptError');
      if (!prompt.value.trim()) {
        promptError.style.display = 'block';
        isValid = false;
      } else {
        promptError.style.display = 'none';
      }

      return isValid;
    }

    // ฟังก์ชันรีเซ็ตฟอร์ม
    function resetForm() {
      promptForm.reset();
      // ซ่อนข้อความแสดงข้อผิดพลาด
      document.getElementById('phoneError').style.display = 'none';
      document.getElementById('promptError').style.display = 'none';
      // ซ่อนข้อความสำเร็จ
      successMessage.style.display = 'none';
      // เปิดใช้งานปุ่มส่ง
      submitBtn.disabled = false;
    }

    // แก้ไขการ submit form
    promptForm.addEventListener('submit', function (e) {
      e.preventDefault();

      if (validateForm()) {
        const uuid = document.getElementById('uuid');
        uuid.value = generateUUID();
        submitBtn.disabled = true;

        const formData = new FormData(promptForm);

        fetch(promptForm.action, {
          method: 'POST',
          body: formData,
          mode: 'no-cors',
        })
          .then(() => {
            console.log('Form submitted successfully');

            const successMessage = document.getElementById('successMessage');
            successMessage.style.display = 'flex';
            promptForm.reset();

            window.scrollTo(0, 0);

            setTimeout(function () {
              successMessage.style.display = 'none';
              submitBtn.disabled = false;
            }, 5000);
          })
          .catch((error) => {
            console.error('Error submitting form:', error);
            alert('Error submitting form');
            submitBtn.disabled = false;
          });
      }
    });

    // จัดการการส่งฟอร์ม
    // promptForm.addEventListener('submit', function (e) {
    //   e.preventDefault();

    //   if (validateForm()) {
    //     // ในสถานการณ์จริงจะเป็นการส่งข้อมูลไปยัง Google Form
    //     promptForm.submit();

    //     // ที่นี่เราจะจำลองการส่งข้อมูลสำเร็จ
    //     successMessage.style.display = 'flex';
    //     promptForm.reset();
    //     submitBtn.disabled = true;

    //     // เลื่อนไปที่ด้านบนเพื่อแสดงข้อความสำเร็จ
    //     window.scrollTo(0, 0);

    //     // รีเซ็ตฟอร์มหลังจาก 3 วินาที
    //     setTimeout(function () {
    //       successMessage.style.display = 'none';
    //       submitBtn.disabled = false;
    //     }, 5000);
    //   }
    // });

    // จัดการการรีเซ็ตฟอร์ม
    resetBtn.addEventListener('click', function () {
      resetForm();
    });

    // ตรวจสอบความถูกต้องแบบเรียลไทม์
    const inputs = document.querySelectorAll('input, textarea');
    inputs.forEach((input) => {
      input.addEventListener('blur', function () {
        if (submitBtn.disabled === false) {
          validateForm();
        }
      });
    });
  });
</script>
